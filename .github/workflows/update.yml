# Phone installation: upload this single file, then rename it in GitHub to
# .github/workflows/update.yml and commit directly to main.
# Enable Settings > Pages > Source: GitHub Actions for publication.
# Initial project is bundled below; subsequent runs preserve existing files.
# No tokens, paid services, or external dependencies are included.
name: Обновить карту терапии
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/catalog.json'
      - '.github/workflows/update.yml'
permissions:
  contents: read
concurrency:
  group: breast-treatment-map-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Подготовить файлы при первой установке
        run: |
          python3 - <<'PY'
          # This bundle contains only the reviewed project snapshot, not credentials.
          # The workflow itself is installed by the repository owner in the GitHub UI.
          # It does not create, replace, or grant permissions to any workflow file.
          import base64
          import hashlib
          import io
          from pathlib import Path
          import zipfile

          expected = ['README.md', 'VALIDATION.md', 'web/index.template.html', 'web/style.css', 'web/app.js', 'scripts/core.py', 'scripts/refresh.py', 'scripts/build.py', 'data/catalog.json', 'data/state.json', 'tests/test_updates.py', 'tests/fixtures/imlunestrant-combo.html']
          if all(Path(name).is_file() for name in expected):
              print('Project is installed; preserving all existing project files.')
          else:
              lines = Path('.github/workflows/update.yml').read_text().splitlines()
              start = lines.index('# BEGIN INITIAL PROJECT BASE64') + 1
              end = lines.index('# END INITIAL PROJECT BASE64', start)
              bundle_lines = lines[start:end]
              if not bundle_lines or not all(line.startswith('# ') for line in bundle_lines):
                  raise SystemExit('Initial project bundle is incomplete')
              packed = base64.b64decode(''.join(line[2:] for line in bundle_lines), validate=True)
              if hashlib.sha256(packed).hexdigest() != '04cd9fec57199e4e626132c7d1737e32ee087a87c6139e68333b4922f10ac49a':
                  raise SystemExit('Initial project checksum mismatch')
              with zipfile.ZipFile(io.BytesIO(packed)) as archive:
                  if len(archive.namelist()) != len(expected) or set(archive.namelist()) != set(expected):
                      raise SystemExit('Unexpected files in the initial project')
                  # Read all members (including CRC checks) before creating any files.
                  members = {name: archive.read(name) for name in expected}
              for name, data in members.items():
                  target = Path(name)
                  # Replace only GitHub's known empty-repository README placeholder.
                  if name == 'README.md' and target.is_file() and target.read_bytes().strip() == b'# breast-treatment-map':
                      target.write_bytes(data)
                      continue
                  if target.exists():
                      print('Preserved existing file:', name)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with target.open('xb') as stream:
                      stream.write(data)
                  print('Created:', name)
              print('Initial project installed. Existing state and custom files are preserved.')
          PY
      - name: Проверить правила обновления
        run: python3 -m unittest discover -s tests -v
      - name: Получить открытые данные
        id: refresh
        continue-on-error: true
        run: python3 scripts/refresh.py
      - name: Собрать страницу
        run: python3 scripts/build.py --automation-configured
      - name: Сохранить историю и состояние проверки
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md VALIDATION.md web/index.template.html web/style.css web/app.js scripts/core.py scripts/refresh.py scripts/build.py data/catalog.json data/state.json tests/test_updates.py tests/fixtures/imlunestrant-combo.html dist/index.html dist/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Update public evidence snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
      - name: Отметить сбой сбора
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::Источники недоступны. Опубликованы сохранённые сведения с датой и состоянием последней проверки.'
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

